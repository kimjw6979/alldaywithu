    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        .screen {
            transition: opacity 0.5s ease, transform 0.5s ease;
            width: 100%;
        }
        
        .screen-hidden {
            opacity: 0;
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 0;
            transform: translateY(20px) scale(0.98);
        }
        
        .screen-active {
            opacity: 1;
            pointer-events: auto;
            position: relative;
            transform: translateY(0) scale(1);
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .grid-item { opacity: 0; }
        .animate-grid .grid-item {
            animation: slideUpFade 0.5s ease forwards;
        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .line-clamp-1 {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 📱 모바일: 스크롤바 숨김 */
        ::-webkit-scrollbar { width: 0px; }

        /* 💻 PC (640px 이상): 브라우저 우측에 예쁜 핑크색 스크롤바 표시 */
        @media (min-width: 640px) {
            ::-webkit-scrollbar { width: 12px; }
            ::-webkit-scrollbar-track { background: transparent; }
            ::-webkit-scrollbar-thumb { background: #fbcfe8; border-radius: 10px; border: 3px solid #fdf2f8; }
            ::-webkit-scrollbar-thumb:hover { background: #f472b6; border-color: #fce7f3; }
        }
    </style>
</head>

            gridContainer.innerHTML = '';
            gridContainer.classList.remove('animate-grid');

            data.steps.forEach((step, index) => {
                const delay = index * 0.1; 
                
                const itemHtml = `
                    <div class="grid-item flex flex-col bg-white rounded-2xl sm:rounded-3xl shadow-sm hover:shadow-lg border border-gray-100 overflow-hidden transform transition-all duration-300 hover:-translate-y-1.5 cursor-pointer" style="animation-delay: ${delay}s" onclick="searchPlace('${step.title}')">
                        <div class="relative w-full h-28 sm:h-36 lg:h-40 bg-gray-100 group">
                            <img src="${step.imgSrc}" alt="${step.title}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" loading="lazy">
                            <div class="absolute inset-0 bg-black/5 group-hover:bg-transparent transition-colors duration-300"></div>
                        </div>
                        <div class="p-4 flex-grow flex flex-col bg-white overflow-hidden">
                            <h3 class="text-sm sm:text-base font-bold text-gray-800 mb-1.5 leading-tight shrink-0 group-hover:text-pink-600 transition-colors flex justify-between items-center w-full">
                                <span class="line-clamp-1 flex-grow pr-1" title="${step.title}">${step.title}</span>
                                <svg class="w-4 h-4 text-gray-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            </h3>
                            <p class="text-[11px] sm:text-xs text-gray-500 leading-snug line-clamp-2">${step.description}</p>
                        </div>
                    </div>
                `;
                gridContainer.insertAdjacentHTML('beforeend', itemHtml);
            });

            setTimeout(() => {
                screenResult.classList.remove('screen-hidden');
                screenResult.classList.add('screen-active');
                
                if (window.innerWidth >= 640) {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }

                setTimeout(() => {
                    gridContainer.classList.add('animate-grid');
                }, 50);
            }, 300);
        }

        function resetApp() {
            screenResult.classList.remove('screen-active');
            screenResult.classList.add('screen-hidden');
            
            setTimeout(() => {
                screenQuestion.classList.remove('screen-hidden');
                screenQuestion.classList.add('screen-active');
                
                if (window.innerWidth >= 640) {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    document.querySelector('.overflow-y-auto').scrollTo({ top: 0, behavior: 'smooth' });
                }
            }, 400);
        }
    </script>
</body>
</html>
